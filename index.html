<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>匯率換算</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="匯率換算">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--sub:#6b7280;--ac:#2563eb;--acbg:#e6eeff;--key:#fff;--op:#fff1e0;--opt:#c2570c;--bd:#e3e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f0f2f5;--sub:#8b93a1;--ac:#6ea0ff;--acbg:#1e2a45;--key:#232731;--op:#3a2a1a;--opt:#ffa24d;--bd:#2a2e38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f0f2f5;--sub:#8b93a1;--ac:#6ea0ff;--acbg:#1e2a45;--key:#232731;--op:#3a2a1a;--opt:#ffa24d;--bd:#2a2e38;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
header h1{font-size:18px;margin:0}
header button{background:none;border:0;color:var(--ac);font-size:15px;padding:8px}
#list{flex:1;overflow-y:auto;padding:6px 12px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:8px 14px;margin-bottom:6px;min-height:58px;cursor:pointer}
.row.on{border-color:var(--ac);background:var(--acbg)}
.flag{font-size:28px}
.nm b{font-size:18px;display:block}.nm span{font-size:12px;color:var(--sub)}
.val{margin-left:auto;text-align:right;min-width:0}
.val .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val .e{font-size:12px;color:var(--sub);min-height:15px}
.rt{font-size:11px;color:var(--sub);text-align:center;padding:2px 0 8px}
.chips{display:flex;gap:8px;padding:0 12px 8px}
.chips button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 0;font-size:13px}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 12px 8px;background:var(--card);border-radius:18px 18px 0 0}
#pad button{height:42px;border:0;border-radius:12px;background:var(--key);color:var(--tx);font-size:20px;box-shadow:inset 0 0 0 1px var(--bd)}
#pad button:active{filter:brightness(.9)}
#pad .op{background:var(--op);color:var(--opt)}
#pad .eq{background:var(--ac);color:#fff;grid-row:span 2;height:auto}
#pad .wide{grid-column:span 2}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--tx);width:min(92vw,480px);max-height:80vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd)}
.opt input{width:auto;margin:0;transform:scale(1.3)}
.opt .r{margin-left:auto;font-size:12px;color:var(--sub)}
#opts{overflow-y:auto;max-height:50vh}
.mv{border:1px solid var(--bd);background:var(--key);color:var(--tx);border-radius:8px;width:40px;height:34px;margin-left:6px;font-size:14px}
.done{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px}
</style>
</head>
<body>
<header><h1>匯率換算</h1><div><button id="bUpd">更新匯率</button><button id="bMng">＋ 管理</button></div></header>
<div id="list"></div>
<div class="rt" id="rt"></div>
<div class="chips" id="chips"></div>
<div id="pad"></div>

<dialog id="dlg">
  <input id="q" placeholder="搜尋幣別（代碼或名稱）">
  <div id="opts"></div>
  <button class="done" id="bDone">完成</button>
</dialog>

<script>
// 以 USD 為基準的參考匯率（約略值，可按「更新匯率」嘗試連線更新）
var CUR={USD:["美元","🇺🇸",1],TWD:["新台幣","🇹🇼",32.5],CNY:["人民幣","🇨🇳",6.67],JPY:["日圓","🇯🇵",158.3],EUR:["歐元","🇪🇺",0.893],MYR:["馬來西亞令吉","🇲🇾",4.056],HKD:["港幣","🇭🇰",7.8],KRW:["韓元","🇰🇷",1450],GBP:["英鎊","🇬🇧",0.77],AUD:["澳幣","🇦🇺",1.52],SGD:["新加坡幣","🇸🇬",1.3],THB:["泰銖","🇹🇭",33],VND:["越南盾","🇻🇳",25400],CAD:["加幣","🇨🇦",1.38]};
var S={codes:["TWD","USD","JPY","CNY","MYR","EUR"],base:"CNY",expr:"5",rates:{},stamp:"內建參考匯率"};
try{var sv=JSON.parse(localStorage.getItem("fx1")||"null");if(sv)S=Object.assign(S,sv)}catch(e){}
function save(){try{localStorage.setItem("fx1",JSON.stringify(S))}catch(e){}}
function rate(c){return S.rates[c]||CUR[c][2]}
function ev(s){
  s=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  while(/[+\-*/.]$/.test(s))s=s.slice(0,-1);
  if(!s||!/^[0-9+\-*/. ]+$/.test(s))return 0;
  try{var v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:0}catch(e){return 0}
}
function fmt(v,c){
  var d=(c==="JPY"||c==="KRW"||c==="VND")?0:(Math.abs(v)<1&&v!==0?4:2);
  return v.toLocaleString("en-US",{maximumFractionDigits:d})
}
function render(){
  var amt=ev(S.expr),usd=amt/rate(S.base),h="";
  S.codes.forEach(function(c){
    var on=c===S.base,v=usd*rate(c),hasOp=/[+\-×÷−]/.test(S.expr.slice(1));
    h+='<div class="row'+(on?' on':'')+'" data-c="'+c+'"><span class="flag">'+CUR[c][1]+'</span><div class="nm"><b>'+c+'</b><span>'+CUR[c][0]+'</span></div><div class="val"><div class="n">'+(on?S.expr:fmt(v,c))+'</div><div class="e">'+(on&&hasOp?'= '+fmt(amt,c):(!on?'1 '+c+' = '+fmt(rate(S.base)/rate(c),S.base)+' '+S.base:''))+'</div></div></div>';
  });
  document.getElementById("list").innerHTML=h;
  document.getElementById("rt").textContent="匯率："+S.stamp+"｜Rates By Exchange Rate API";
  save();
}
var ops="+−×÷";
function press(k){
  var e=S.expr;
  if(k==="C")e="0";
  else if(k==="⌫")e=e.length>1?e.slice(0,-1):"0";
  else if(k==="="){var v=ev(e);e=String(+v.toFixed(6))}
  else if(ops.indexOf(k)>=0){if(ops.indexOf(e.slice(-1))>=0)e=e.slice(0,-1)+k;else e+=k}
  else if(k==="."){var last=e.split(/[+−×÷]/).pop();if(last.indexOf(".")<0)e+="."}
  else if(k==="00"){if(e==="0"||/[+−×÷]0$/.test(e));else if(ops.indexOf(e.slice(-1))>=0)e+="0";else e+="00"}
  else{if(e==="0")e=k;else if(/[+−×÷]0$/.test(e))e=e.slice(0,-1)+k;else e+=k}
  if(e.length>24)return;
  S.expr=e;render();
}
var keys=["C","÷","×","⌫","7","8","9","−","4","5","6","+","1","2","3","=","0","00","."];
var pad=document.getElementById("pad");
keys.forEach(function(k){
  var b=document.createElement("button");b.textContent=k;
  if("÷×−+".indexOf(k)>=0||k==="⌫"||k==="C")b.className="op";
  if(k==="=")b.className="eq";
    b.onclick=function(){press(k)};
  pad.appendChild(b);
});
function swap(){ // 將目前幣別與第一列互換位置
  var i=S.codes.indexOf(S.base);if(i>0){var t=S.codes[0];S.codes[0]=S.codes[i];S.codes[i]=t;render()}
}
document.getElementById("list").onclick=function(ev2){
  var r=ev2.target.closest(".row");if(!r)return;
  var c=r.dataset.c;if(c===S.base)return;
  var v=ev(S.expr)/rate(S.base)*rate(c);
  S.base=c;S.expr=String(+v.toFixed(c==="JPY"?0:2));render();
};
var chips=document.getElementById("chips");
[10,100,1000,10000].forEach(function(n){
  var b=document.createElement("button");b.textContent=n.toLocaleString("en-US");
  b.onclick=function(){S.expr=String(n);render()};chips.appendChild(b);
});
// 管理幣別
var dlg=document.getElementById("dlg"),opts=document.getElementById("opts"),q=document.getElementById("q");
function drawOpts(){
  var t=q.value.trim().toLowerCase(),h="";
  if(!t){
    h+='<div class="rt" style="text-align:left">已選幣別（用 ▲▼ 調整順序）</div>';
    S.codes.forEach(function(c,i){h+='<div class="opt"><span class="flag">'+CUR[c][1]+'</span><b>'+c+'</b><span>'+CUR[c][0]+'</span><span class="r"><button class="mv" data-m="-1" data-i="'+i+'">▲</button><button class="mv" data-m="1" data-i="'+i+'">▼</button></span></div>'});
    h+='<div class="rt" style="text-align:left;padding-top:10px">新增 / 刪除</div>';
  }
  Object.keys(CUR).forEach(function(c){
    if(t&&c.toLowerCase().indexOf(t)<0&&CUR[c][0].indexOf(t)<0)return;
    h+='<label class="opt"><input type="checkbox" data-c="'+c+'"'+(S.codes.indexOf(c)>=0?' checked':'')+'><span class="flag">'+CUR[c][1]+'</span><b>'+c+'</b><span>'+CUR[c][0]+'</span></label>';
  });
  opts.innerHTML=h;
}
document.getElementById("bMng").onclick=function(){q.value="";drawOpts();dlg.showModal()};
q.oninput=drawOpts;
opts.onchange=function(e){
  var c=e.target.dataset.c,i=S.codes.indexOf(c);
  if(e.target.checked){if(i<0)S.codes.push(c)}
  else{
    if(S.codes.length<=2){e.target.checked=true;alert("至少要保留兩種幣別");return}
    S.codes.splice(i,1);
    if(c===S.base){var nb=S.codes[0];S.expr=String(+(ev(S.expr)/rate(c)*rate(nb)).toFixed(2));S.base=nb}
  }
  var st=opts.scrollTop;render();drawOpts();opts.scrollTop=st;
};
opts.onclick=function(e){
  var b=e.target.closest(".mv");if(!b)return;
  var i=+b.dataset.i,j=i+ +b.dataset.m;if(j<0||j>=S.codes.length)return;
  var t=S.codes[i];S.codes[i]=S.codes[j];S.codes[j]=t;
  var st=opts.scrollTop;render();drawOpts();opts.scrollTop=st;
};
document.getElementById("bDone").onclick=function(){dlg.close()};
// 自動更新匯率（開啟、切回前景時；距上次超過 1 小時才抓）
var bU=document.getElementById("bUpd");
function upd(force){
  if(!force&&S.ts&&Date.now()-S.ts<3600000)return;
  var rt=document.getElementById("rt");bU.disabled=true;bU.textContent="更新中…";
  fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(d){
    if(!d.rates)throw 0;
    Object.keys(CUR).forEach(function(c){if(d.rates[c])S.rates[c]=d.rates[c]});
    S.ts=Date.now();S.stamp="已更新 "+new Date().toLocaleString("zh-TW");render();
  }).catch(function(){rt.textContent="離線，沿用："+S.stamp}).then(function(){bU.disabled=false;bU.textContent="更新匯率"});
}
bU.onclick=function(){upd(true)};
document.addEventListener("visibilitychange",function(){if(!document.hidden)upd(false)});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
render();upd(false);
</script>
</body>
</html>
